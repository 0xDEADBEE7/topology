[package]
name = "assay"
version = "0.1.0"
edition = "2021"

[dependencies]
syn                 = { version = "2", features = ["full", "visit"] }
proc-macro2         = { version = "1", features = ["span-locations"] }
tree-sitter-typescript = "0.20"
tree-sitter          = "0.20"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"

[profile.release]
strip = true
lto   = true
