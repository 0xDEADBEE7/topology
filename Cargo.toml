[package]
name = "topology"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
tree-sitter-typescript = "0.23.2"
tree-sitter          = "0.25.10"
tree-sitter-python   = "0.25.0"
tree-sitter-rust     = "0.24.2"
serde_json          = "1"

[profile.release]
strip         = true
lto           = true
codegen-units = 1
